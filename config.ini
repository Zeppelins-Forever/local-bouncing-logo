; =============================================================================
;  Bouncing logo settings
; =============================================================================
;  Everything in this file is optional. Delete it entirely and the page still
;  works with the defaults shown below.
;
;  Syntax:  key = value     Comments start with ; (or # at the start of a line).
;  A setting that is commented out (or missing) uses the default shown next to it.
;  Lists can be separated with commas or | (glow, pill  or  glow|pill).
;  Changes take effect on the next page reload.
;
;  Any [screen] setting can also be given in the URL, which wins over this file:
;      http://localhost:8000/?count=3&frame=glow,pill
; =============================================================================

[screen]
; count      = 1            ; logos on screen (1-40). Extra logos slide in from the edges.
; logos      = all          ; which files in logos/ may appear: all | 1-3 | 1,3 | name words (e.g. color,white)
;                           ;   numbers are positions in alphabetical order, so name files 01-..., 02-...
; frame      = all          ; frames to show: all | off, glow, double, brackets, pill
; recolor    = auto         ; auto = recolour a logo only when it has no frame (the classic look)
;                           ; or a list of: on, match, off   (see "Recolour modes" below)
; same       = no           ; yes = every logo on screen is the same file, frame and colour mode
; glow       = 1            ; glow strength of the glow and pill frames (0 = none, 2 = twice as large)
; size       = 0.5-1.15     ; random size range (1 = normal size). One number = fixed size.
; shrink     = 0.3          ; how much logos shrink as count rises (0 = never shrink)
; fill       = 0.35         ; logos never cover more than this fraction of the screen in total
; speed      = 0.6-1.6      ; random speed range (1 = normal speed). One number = fixed speed.
; gap        = 2.5          ; seconds between logos entering (0 = all at once)
; collide    = yes          ; logos bounce off each other
; jump       = 40           ; each colour change moves at least this far round the colour wheel (0-120)
; messages   = yes          ; show short on-screen messages for keyboard shortcuts
; background = #111111      ; page background colour


; =============================================================================
;  Per-logo rules: what each logo is ALLOWED to do
; =============================================================================
;  Start a section with the file's name in [brackets] (the .svg can be left off).
;  A logo with no section, or a setting left out, uses these defaults (everything allowed):
;
;      frame   = all       ; off, glow, double, brackets, pill
;      recolor = all       ; on, match, off
;      size    = 1         ; size relative to other logos (0.8 = 20% smaller),
;                          ;   or a fixed artwork width in pixels (240px)
;      weight  = 1         ; how often it is picked relative to other logos (0 = never)
;
;  Each list is complete: only the values you name are ever used for that logo.
;  The screen settings above then choose among what each logo allows.
;
;  Frames (the frame always takes the changing colour):
;      off       no frame. The logo bounces off others using its own outline
;                (a heptagon logo collides as a heptagon; hollow shapes use their outer outline)
;      glow      rounded frame with a glow
;      double    thick + thin double line
;      brackets  four corner brackets
;      pill      capsule with a glow
;
;  Recolour modes (what happens to the logo's own colours):
;      off       the logo keeps its exact colours
;      on        the logo is drawn in one changing colour. With a frame, the logo takes the
;                opposite colour to the frame, so the two never look alike.
;      match     the logo is drawn in the frame's colour (without a frame: the same as on)
;
;  frame = off  +  recolor = off   shows the logo exactly as it is: no frame, its own colours.
;
;  If your web server cannot list folders, add a section with the FULL file name
;  (e.g. [01-sample-orbit.svg], it may be empty) for every file in logos/.
; =============================================================================

; Brand colours must never change. Frames are fine.
[01-sample-orbit.svg]
frame   = glow, double, brackets, pill
recolor = off

; Example: always shown exactly as it is (own colours, no frame, bounces off its own outline).
[02-Kubernetes_logo.svg]
frame   = off
recolor = off

; Example (inactive): only ever a single changing colour without a frame, a bit smaller.
; [03-SQLite.svg]
; frame   = off
; recolor = on
; size    = 0.9

[04-firefox.svg.webp]
; Leave it blank like this to allow most default option combinations.
; Or, simply don't include a header for the file at all!
